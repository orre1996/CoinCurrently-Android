# Copy this file to Config/secrets.properties.
# Config/secrets.properties is gitignored and is loaded into BuildConfig at build time.
# Placeholder values are enough to launch.
#
# google-services.json is optional. Without CoinCurrently/app/google-services.json,
# Firebase does not start. Copy Config/google-services.json.example there and
# replace the placeholders only for anonymous sign-in and price-alert push.
# The example placeholders are not a working Firebase config. That file is gitignored.

# Market routes are "{API_BASE_URL}/crypto/api/v3/..." when this is your backend.
# Leave the placeholder, leave it empty, or omit this file to call CoinGecko's
# keyless API at https://api.coingecko.com/api/v3 instead. No API key is required
# for that. Setting this to https://api.coingecko.com selects that same host,
# without the `/crypto` prefix. No trailing slash.
# Price alerts, wallet import, gas fees, and the other first-party routes stay
# empty until this points at a backend.
API_BASE_URL=https://api.example.com

# Sent as the x-coin-currently-key header on backend requests. A placeholder is
# enough for the public CoinGecko and fear-and-greed calls. The backend is not
# open source; this key is only useful with that API.
BACKEND_API_KEY=your-backend-api-key

# Aptabase analytics app key.
APTABASE_APP_KEY=A-XX-0000000000

# Optional. Added as x-scheduler-price-alert-secret on price-alert-trigger and
# big-mover-trigger requests. Leave empty if unused.
SCHEDULER_PRICE_ALERT_SECRET=
