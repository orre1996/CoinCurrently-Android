plugins {
    id 'kotlinx-serialization'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def googleServicesJson = file("google-services.json")
if (!googleServicesJson.exists()) {
    throw new GradleException(
            "Missing google-services.json. Copy Config/google-services.json.example to " +
                    "CoinCurrently/app/google-services.json and fill in your Firebase config."
    )
}

def repoRoot = rootProject.projectDir.parentFile
def secretsFile = new File(repoRoot, "Config/secrets.properties")
def secretsExampleFile = new File(repoRoot, "Config/secrets.example.properties")
def secrets = new Properties()
if (secretsFile.exists()) {
    secretsFile.withInputStream { secrets.load(it) }
} else if (secretsExampleFile.exists()) {
    logger.warn("Config/secrets.properties not found; using example placeholders. " +
            "Copy Config/secrets.example.properties to Config/secrets.properties and fill in your values.")
    secretsExampleFile.withInputStream { secrets.load(it) }
} else {
    throw new GradleException(
            "Missing Config/secrets.properties. Copy Config/secrets.example.properties to " +
                    "Config/secrets.properties and fill in your values."
    )
}

def buildConfigString = { String key ->
    def value = secrets.getProperty(key, "") ?: ""
    return '"' + value.replace("\\", "\\\\").replace("\"", "\\\"") + '"'
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'com.google.firebase.firebase-perf'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    if (project.android.hasProperty("namespace")) {
        namespace("com.cryptium.coincurrently")
    }

    signingConfigs {
        release {
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }


    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
        freeCompilerArgs += [
                "-Xjvm-default=all",
        ]
    }

    defaultConfig {
        applicationId "com.cryptium.coincurrently"
        minSdkVersion 31
        targetSdkVersion 36
        versionCode 223
        versionName "3.3.1"
        compileSdk 36
        buildToolsVersion = "36.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        signingConfig signingConfigs.debug

        buildConfigField 'String', 'API_BASE_URL', buildConfigString('API_BASE_URL')
        buildConfigField 'String', 'BACKEND_API_KEY', buildConfigString('BACKEND_API_KEY')
        buildConfigField 'String', 'APTABASE_APP_KEY', buildConfigString('APTABASE_APP_KEY')
        buildConfigField 'String', 'SCHEDULER_PRICE_ALERT_SECRET', buildConfigString('SCHEDULER_PRICE_ALERT_SECRET')
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField 'boolean', 'IN_DEBUG', 'false'
            buildConfigField 'String', 'REVENUECAT_API_KEY', buildConfigString('REVENUECAT_PRODUCTION_API_KEY')
        }
        debug {
            buildConfigField 'boolean', 'IN_DEBUG', 'true'
            buildConfigField 'String', 'REVENUECAT_API_KEY', buildConfigString('REVENUECAT_TEST_API_KEY')
        }
    }
    lint {
        checkReleaseBuilds false
    }
    namespace 'com.cryptium.coincurrently'
}

repositories {
    // Patched play-services-basement (see gms-local-repo / gms-patches).
    maven { url = uri("${projectDir}/gms-local-repo") }
    maven { url 'https://jitpack.io' }
}

configurations.configureEach {
    resolutionStrategy.force(
            "com.android.billingclient:billing:8.3.0",
            // Align GMS artifacts pulled in by Billing, Firebase, RevenueCat, and ML Kit.
            // Stock basement 18.4+ calls StrictMode.VmPolicy.Builder.permitUnsafeIntentLaunch()
            // (API 31) from a helper (zzd). With minSdk 31, R8 folds isAtLeastS() → true, and
            // incomplete ROMs that report API 31 but lack the method crash with NoSuchMethodError.
            // 18.11.0-safe is stock 18.11.0 with zzd using reflection (see gms-patches/).
            "com.google.android.gms:play-services-basement:18.11.0-safe",
            // base 18.6+ calls Context.getAttributionSource() (API 31). With minSdk 31, R8
            // strips the SDK_INT guard → NoSuchMethodError on API 30 sideloads / incomplete ROMs.
            // 18.5.0 is the last release without that call.
            "com.google.android.gms:play-services-base:18.5.0",
    )
}

dependencies {
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.0'

    implementation 'androidx.navigation:navigation-compose:2.8.3'

    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.2.0") {
            because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.0") {
            because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
        }
    }

    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'androidx.core:core-ktx:1.7.0'

    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.2.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.3.1'

    // Widgets, CustomImageView color extraction, and StorageManager DiskLruCache
    implementation 'com.github.bumptech.glide:glide:4.11.0'

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.google.code.gson:gson:2.8.6'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
